<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知行 ZhiXing · 会说也会做</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --line:#e4e8ee; --line-soft:#eef1f5;
    --text:#1b1f26; --muted:#6b7280; --faint:#9aa3af;
    --accent:#2f6fed; --accent-soft:#eaf1ff;
    --ok:#16a34a; --ok-soft:#e9f7ee; --warn:#c2751a; --warn-soft:#fdf3e3;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.6;
  }
  .app{display:flex; height:100vh; overflow:hidden;}

  /* ---------- 侧栏 ---------- */
  .side{
    width:272px; flex:0 0 272px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 16px; gap:16px; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .logo{
    width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex:0 0 34px;
  }
  .brand h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.2px;}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--faint);}
  .badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;
    font-size:11.5px;background:var(--accent-soft);color:var(--accent);width:100%;
  }
  .badge.rules{background:var(--warn-soft);color:var(--warn);}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px;}
  .sec-title{
    font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;
    margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center;
  }
  .sec-title button{
    border:none;background:none;color:var(--accent);font-size:11px;cursor:pointer;padding:0;font-family:inherit;
  }
  .list{display:flex;flex-direction:column;gap:6px;}
  .list .empty{font-size:12px;color:var(--faint);padding:4px 0;}
  .item{
    font-size:12.5px;padding:7px 9px;border-radius:9px;background:#f7f9fc;
    border:1px solid var(--line-soft);color:#374151;word-break:break-all;
  }
  .item.done{color:var(--faint);text-decoration:line-through;}
  .item .tag{
    display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;margin-right:6px;
    background:var(--accent-soft);color:var(--accent);
  }
  .item .tag.high{background:#ffecec;color:#d64545;}
  .item .tag.low{background:#f1f2f4;color:var(--faint);}
  .item.file{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;}

  /* ---------- 主区 ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:52px;flex:0 0 52px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  }
  .topbar .title{font-size:13.5px;font-weight:600;}
  .topbar .meta{font-size:11.5px;color:var(--faint);display:flex;gap:12px;align-items:center;}
  .messages{flex:1;overflow-y:auto;padding:22px 20px 8px;}
  .wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  .row{display:flex;gap:10px;}
  .row.user{justify-content:flex-end;}
  .avatar{
    width:28px;height:28px;border-radius:9px;flex:0 0 28px;display:flex;align-items:center;
    justify-content:center;font-size:12px;font-weight:600;
  }
  .avatar.bot{background:var(--accent);color:#fff;}
  .bubble{
    max-width:min(620px,82%);padding:11px 14px;border-radius:12px;background:var(--panel);
    border:1px solid var(--line);overflow-wrap:anywhere;
  }
  .row.user .bubble{background:var(--accent);border-color:var(--accent);color:#fff;}
  .bubble p{margin:0 0 8px;} .bubble p:last-child{margin-bottom:0;}
  .bubble ul{margin:6px 0;padding-left:20px;} .bubble li{margin:3px 0;}
  .bubble h3,.bubble h4,.bubble h5{margin:10px 0 6px;font-size:13.5px;font-weight:600;}
  .bubble h3:first-child,.bubble h4:first-child{margin-top:0;}
  .bubble code{
    background:#f1f3f7;padding:1px 5px;border-radius:5px;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .row.user .bubble code{background:rgba(255,255,255,.22);color:#fff;}
  .bubble pre.code{
    background:#f7f9fc;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    overflow-x:auto;font-size:12px;margin:8px 0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;
  }
  .bubble blockquote{
    margin:8px 0;padding:2px 0 2px 10px;border-left:2px solid var(--accent);color:var(--muted);font-size:12.5px;
  }
  .bubble table{border-collapse:collapse;margin:8px 0;font-size:12.5px;width:100%;}
  .bubble th,.bubble td{border:1px solid var(--line);padding:5px 9px;text-align:left;}
  .bubble th{background:#f7f9fc;font-weight:600;}

  /* ---------- 工具调用卡片 ---------- */
  .tool{
    border:1px solid var(--line);border-radius:10px;background:#fbfcfe;margin-bottom:8px;
    font-size:12px;overflow:hidden;
  }
  .tool summary{
    cursor:pointer;padding:7px 11px;display:flex;align-items:center;gap:8px;list-style:none;
    color:#3f4756;
  }
  .tool summary::-webkit-details-marker{display:none;}
  .tool .tname{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-weight:600;
  }
  .tool .args{
    color:var(--faint);font-family:ui-monospace,Menlo,monospace;font-size:11px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
  }
  .tool .pill{
    font-size:10px;padding:1px 7px;border-radius:20px;background:var(--ok-soft);color:var(--ok);flex:0 0 auto;
  }
  .tool .pill.fail{background:#ffecec;color:#d64545;}
  .tool-body{
    margin:0;padding:10px 12px;border-top:1px solid var(--line);background:#fff;
    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#4b5563;
    white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow-y:auto;
  }

  .typing{display:flex;gap:4px;padding:13px 15px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes bl{0%,60%,100%{opacity:.28;}30%{opacity:1;}}

  /* ---------- 输入区 ---------- */
  .composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px 14px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto 10px;}
  .chip{
    font-size:12px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    background:#fff;color:#4b5563;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .inputbar{
    max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
    border:1px solid var(--line);border-radius:13px;padding:8px 8px 8px 13px;background:#fff;
    transition:.15s;
  }
  .inputbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,111,237,.09);}
  textarea{
    flex:1;border:none;outline:none;resize:none;font-family:inherit;font-size:14px;
    line-height:1.55;max-height:132px;padding:5px 0;background:transparent;color:var(--text);
  }
  .iconbtn{
    width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);background:#fff;
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);
    transition:.15s;padding:0;
  }
  .iconbtn:hover{border-color:var(--accent);color:var(--accent);}
  .iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}
  .iconbtn.rec{background:#ffecec;border-color:#d64545;color:#d64545;animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
  .send{
    height:34px;padding:0 16px;border-radius:9px;border:none;background:var(--accent);color:#fff;
    font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;flex:0 0 auto;
  }
  .send:disabled{background:#c3cede;cursor:not-allowed;}
  .hint{max-width:760px;margin:7px auto 0;font-size:11px;color:var(--faint);text-align:center;}
  svg{display:block;}
  @media (max-width:860px){ .side{display:none;} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">知</div>
      <div><h1>知行 ZhiXing</h1><p>会说，也会做</p></div>
    </div>
    <div class="badge" id="modeBadge"><span class="dot"></span><span id="modeText">正在连接…</span></div>

    <div>
      <p class="sec-title"><span>待办清单</span><button id="refreshBtn">刷新</button></p>
      <div class="list" id="todoList"><div class="empty">加载中…</div></div>
    </div>

    <div>
      <p class="sec-title"><span>沙箱文件</span></p>
      <div class="list" id="fileList"><div class="empty">加载中…</div></div>
    </div>

    <div>
      <p class="sec-title"><span>会话</span></p>
      <div class="list">
        <div class="item" id="sessionInfo">--</div>
        <button class="chip" id="resetBtn" style="width:100%;">清空当前会话记忆</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title">对话工作台</div>
      <div class="meta">
        <span id="modelInfo">--</span>
        <span id="toolInfo">--</span>
      </div>
    </div>

    <div class="messages" id="messages"><div class="wrap" id="wrap"></div></div>

    <div class="composer">
      <div class="chips">
        <button class="chip">我明天要去杭州，帮我看看天气和出行建议</button>
        <button class="chip">帮我记一下：周三下午交软件工程实验报告，优先级高</button>
        <button class="chip">看看我的待办清单</button>
        <button class="chip">把待办清单导出成 Markdown 文件</button>
        <button class="chip">算一下 128*37+56</button>
      </div>
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="说句话，我来办。例如：提醒我周五交作业"></textarea>
        <button class="iconbtn" id="micBtn" title="语音输入">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
          </svg>
        </button>
        <button class="iconbtn" id="ttsBtn" title="语音播报">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          </svg>
        </button>
        <button class="send" id="sendBtn">发送</button>
      </div>
      <div class="hint">Enter 发送 · Shift+Enter 换行 · 麦克风图标使用浏览器语音识别</div>
    </div>
  </main>
</div>

<script>
const state = {
  sessionId: localStorage.getItem("zx_session") || ("web-" + Date.now().toString(36)),
  tts: localStorage.getItem("zx_tts") === "1",
  busy: false,
};
localStorage.setItem("zx_session", state.sessionId);

const $ = (id) => document.getElementById(id);
const wrap = $("wrap"), input = $("input"), sendBtn = $("sendBtn");

/* ---------------- 极简 Markdown 渲染 ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function inlineMd(s){
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function renderMd(src){
  const store = [];
  let text = esc(src).replace(/```([\s\S]*?)```/g, (m, code) => {
    store.push('<pre class="code">' + code.replace(/^\n/, "") + "</pre>");
    return "\u0001" + (store.length - 1) + "\u0001";
  });

  const out = [];
  let listOpen = false, tableBuf = [];
  const closeList = () => { if (listOpen) { out.push("</ul>"); listOpen = false; } };
  const flushTable = () => {
    if (!tableBuf.length) return;
    const rows = tableBuf
      .filter(r => !/^\s*\|[\s\-|:]+\|\s*$/.test(r))
      .map(r => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim()));
    if (rows.length) {
      out.push("<table>");
      rows.forEach((cells, i) => {
        const tag = i === 0 ? "th" : "td";
        out.push("<tr>" + cells.map(c => `<${tag}>${inlineMd(c)}</${tag}>`).join("") + "</tr>");
      });
      out.push("</table>");
    }
    tableBuf = [];
  };

  for (const line of text.split("\n")) {
    if (/^\s*\|.*\|\s*$/.test(line)) { closeList(); tableBuf.push(line); continue; }
    flushTable();
    const t = line.trim();
    if (!t) { closeList(); continue; }
    const h = t.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); const lv = Math.min(6, h[1].length + 2); out.push(`<h${lv}>${inlineMd(h[2])}</h${lv}>`); continue; }
    const li = t.match(/^[-*]\s+(.*)$/);
    if (li) { if (!listOpen) { out.push("<ul>"); listOpen = true; } out.push(`<li>${inlineMd(li[1])}</li>`); continue; }
    const bq = t.match(/^&gt;\s*(.*)$/);
    if (bq) { closeList(); out.push(`<blockquote>${inlineMd(bq[1])}</blockquote>`); continue; }
    closeList();
    out.push(`<p>${inlineMd(t)}</p>`);
  }
  closeList(); flushTable();
  return out.join("").replace(/\u0001(\d+)\u0001/g, (m, i) => store[+i]);
}

/* ---------------- 消息渲染 ---------------- */
function scrollDown(){ const box = document.querySelector(".messages"); box.scrollTop = box.scrollHeight; }

function addUser(text){
  const row = document.createElement("div");
  row.className = "row user";
  row.innerHTML = `<div class="bubble">${renderMd(text)}</div>`;
  wrap.appendChild(row); scrollDown();
}

function addToolCard(step){
  const ok = step.ok !== false;
  const detail = ok
    ? (step.result == null ? "(无返回)" : JSON.stringify(step.result, null, 2))
    : ("错误：" + (step.error || "未知"));
  const el = document.createElement("details");
  el.className = "tool";
  el.innerHTML =
    `<summary><span class="pill ${ok ? "" : "fail"}">${ok ? "成功" : "失败"}</span>` +
    `<span class="tname">${esc(step.tool)}</span>` +
    `<span class="args">${esc(JSON.stringify(step.arguments || {}))}</span></summary>` +
    `<pre class="tool-body">${esc(detail)}</pre>`;
  return el;
}

function addBot(data){
  const row = document.createElement("div");
  row.className = "row";
  const col = document.createElement("div");
  col.style.cssText = "max-width:min(640px,84%);display:flex;flex-direction:column;";
  const avatar = `<div class="avatar bot">知</div>`;

  const holder = document.createElement("div");
  (data.steps || []).forEach(s => holder.appendChild(addToolCard(s)));

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = renderMd(data.reply || "");
  holder.appendChild(bubble);

  row.innerHTML = avatar;
  row.appendChild(col);
  col.appendChild(holder);
  wrap.appendChild(row);
  scrollDown();
  if (state.tts) speak(data.reply || "");
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "row"; row.id = "typingRow";
  row.innerHTML = `<div class="avatar bot">知</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>`;
  wrap.appendChild(row); scrollDown();
}
function hideTyping(){ const el = $("typingRow"); if (el) el.remove(); }

/* ---------------- 与后端交互 ---------------- */
async function send(text){
  text = (text || "").trim();
  if (!text || state.busy) return;
  state.busy = true; sendBtn.disabled = true;
  addUser(text); input.value = ""; autoGrow();
  showTyping();
  try{
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: state.sessionId, message: text}),
    });
    const data = await res.json();
    hideTyping();
    if (data.error) { addBot({reply: "**出错了：** " + data.error, steps: []}); }
    else { addBot(data); }
    if (data.error && data.error.includes("消息")) {}
  }catch(err){
    hideTyping();
    addBot({reply: "**网络异常：** " + err.message + "\n\n请确认后端 `python server.py` 仍在运行。", steps: []});
  }finally{
    state.busy = false; sendBtn.disabled = false; input.focus();
    refreshSidebar();
  }
}

async function refreshSidebar(){
  try{
    const [todos, files, status] = await Promise.all([
      fetch("/api/todos").then(r => r.json()),
      fetch("/api/files").then(r => r.json()),
      fetch("/api/status").then(r => r.json()),
    ]);

    const tl = $("todoList");
    const items = (todos.items || []).filter(i => i.status !== "done");
    tl.innerHTML = items.length
      ? items.map(i => {
          const pr = i.priority || "normal";
          const label = pr === "high" ? "高" : (pr === "low" ? "低" : "中");
          return `<div class="item"><span class="tag ${pr}">${label}</span>#${i.id} ${esc(i.text)}` +
                 (i.due ? ` <span style="color:#9aa3af">· ${esc(i.due)}</span>` : "") + "</div>";
        }).join("")
      : '<div class="empty">暂无待办</div>';

    const fl = $("fileList");
    const fs = files.files || [];
    fl.innerHTML = fs.length
      ? fs.map(f => `<div class="item file">${esc(f.path)} <span style="color:#9aa3af">${f.bytes}B</span></div>`).join("")
      : '<div class="empty">暂无文件</div>';

    const badge = $("modeBadge"), modeText = $("modeText");
    if (status.mode === "llm") {
      badge.classList.remove("rules");
      modeText.textContent = "大模型模式 · " + status.model;
    } else {
      badge.classList.add("rules");
      modeText.textContent = "规则模式（未配置 API Key）";
    }
    $("modelInfo").textContent = status.model || "--";
    $("toolInfo").textContent = `已挂载 ${status.tool_count} 个工具`;
  }catch(err){ /* 静默 */ }
}

/* ---------------- 语音：输入 + 输出 ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recording = false;

$("micBtn").addEventListener("click", () => {
  if (!SR) { alert("当前浏览器不支持语音识别，请改用 Chrome / Edge 打开本页面。"); return; }
  if (recording) { recog && recog.stop(); return; }
  recog = recog || new SR();
  recog.lang = "zh-CN"; recog.continuous = false; recog.interimResults = true;
  recog.onresult = (e) => {
    let txt = "";
    for (const r of e.results) txt += r[0].transcript;
    input.value = txt; autoGrow();
  };
  recog.onend = () => { recording = false; $("micBtn").classList.remove("rec"); input.focus(); };
  recog.onerror = () => { recording = false; $("micBtn").classList.remove("rec"); };
  recording = true; $("micBtn").classList.add("rec");
  try { recog.start(); } catch(err) { recording = false; $("micBtn").classList.remove("rec"); }
});

function speak(text){
  if (!("speechSynthesis" in window)) return;
  const clean = String(text).replace(/[#*`>|_\-]/g, " ").replace(/\s+/g, " ").slice(0, 400);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "zh-CN"; u.rate = 1.05;
  speechSynthesis.speak(u);
}
const ttsBtn = $("ttsBtn");
function syncTts(){ ttsBtn.classList.toggle("on", state.tts); }
ttsBtn.addEventListener("click", () => {
  state.tts = !state.tts;
  localStorage.setItem("zx_tts", state.tts ? "1" : "0");
  syncTts();
  if (!state.tts && "speechSynthesis" in window) speechSynthesis.cancel();
});
syncTts();

/* ---------------- 输入交互 ---------------- */
function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 132) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
sendBtn.addEventListener("click", () => send(input.value));
document.querySelectorAll(".chip:not(#resetBtn)").forEach(c => {
  c.addEventListener("click", () => send(c.textContent));
});
$("refreshBtn").addEventListener("click", refreshSidebar);
$("resetBtn").addEventListener("click", async () => {
  await fetch("/api/reset", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({session_id: state.sessionId}),
  });
  wrap.innerHTML = "";
  await boot();
});

/* ---------------- 启动：恢复历史（体现多轮记忆） ---------------- */
async function boot(){
  await refreshSidebar();
  const hist = await fetch("/api/history?session_id=" + encodeURIComponent(state.sessionId)).then(r => r.json());
  const records = hist.records || [];
  records.forEach(r => {
    if (r.role === "user") addUser(r.content);
    else addBot({reply: r.content, steps: r.steps || []});
  });
  $("sessionInfo").textContent = `会话 ${state.sessionId} · 已进行 ${records.filter(r => r.role === "user").length} 轮`;

  if (!records.length) {
    addBot({
      reply: "你好，我是 **知行 ZhiXing**，会说也会做。\n\n我可以帮你：\n\n- 管理待办、生成清单\n- 查天气并给出行建议\n- 读写文件（沙箱内）、导出 Markdown\n- 做计算、看时间\n\n直接说需求就行，比如「提醒我周五交作业」或者「杭州明天要带伞吗」。",
      steps: [],
    });
  }
  input.focus();
}
boot();
</script>
